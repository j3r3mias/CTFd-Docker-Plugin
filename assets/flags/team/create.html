<label>
	Team flag<br>
	<small>The flag of one team. Another team submitting it gets "Incorrect" and goes to the cheat log.</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}" placeholder="Flag">
</div>
<div class="form-group">
	<input type="text" class="form-control" name="data" value="{{ data }}" placeholder="Team name (user name in user mode)">
</div>
<input type="hidden" name="type" value="team">
